  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ction redoDB(){\n  if(_hidx >= _hist.length - 1) return;\n  _hidx++;\n  const db = JSON.parse(_hist[_hidx]);\n  localStorage.setItem(DB_KEY, JSON.stringify(db));\n  render(); toast('Redone');\n}\n\n// ── DATA ──────────────────────────────────────────────────────────────────\nconst DB_KEY = 'sb_launch_hub_v1';\nconst OWNERS = ['Johan', 'Christoffer', 'Isaac', 'Joakim'];\nconst STATUSES = [\n  { key:'not-started',  label:'Not started',  cls:'s-ns' },\n  { key:'in-production',label:'In production',cls:'s-ip' },\n  { key:'approved',     label:'Approved',     cls:'s-ap' },\n  { key:'published',    label:'Published',    cls:'s-pb' },\n];\nconst TYPES = [\n  { id:'launch-brief',    label:'Launch Brief',         ico:()=>iClipboard(), auto:true, owner:'Christoffer', deadlineDays:30 },\n  { id:'product-photos',  label:'Product photos',      ico:()=>iCamera(),  auto:true, owner:'Christoffer', notes:'Cut-out-images, Studio Photos.' },\n  { id:'on-location',     label:'On-Location Shoot',   ico:()=>iApert(),              owner:'Christoffer', notes:'Artist, On-location Imagery.' },\n  { id:'video-ad',        label:'Video ad(s)',          ico:()=>iPlay(),              owner:'Christoffer' },\n  { id:'still-ad',        label:'Still ad(s)',          ico:()=>iCamera(),            owner:'Christoffer' },\n  { id:'launch-film',     label:'Launch Video',         ico:()=>iFilm(),              owner:'Christoffer' },\n  { id:'social-intro',    label:'Social intro film',    ico:()=>iVideo(),             owner:'Christoffer' },\n  { id:'hero-video',      label:'E-com Assets',         ico:()=>iMonitor(),           owner:'Christoffer', notes:'PDP/Series Page.' },\n];\n\nfunction getDB(){ try{ return JSON.parse(localStorage.getItem(DB_KEY))||mkDB(); }catch(e){ return mkDB(); } }\nfunction mkDB(){ return { launches:[], settings:{ warnDays:3, owners:['Johan','Christoffer','Isaac','Joakim'] } }; }\nfunction getOwners(db){ const o=db.settings.owners; return (o&&o.length)?o:OWNERS; }\nfunction saveDB(db){ localStorage.setItem(DB_KEY, JSON.stringify(db)); _histPush(db); }\nfunction uid(){ return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4); }\nfunction mkAsset(t,launchDate){\n  let deadline='';\n  const daysBack = t.deadlineDays !== undefined ? t.deadlineDays : 7;\n  if(launchDate){ const d=new Date(launchDate); d.setDate(d.getDate()-daysBack); deadline=d.toISOString().slice(0,10); }\n  return {id:uid(),typeId:t.id,label:t.label,owner:t.owner||'',deadline,status:'Not started',notes:t.notes||''};\n}\nfunction esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/<\u002Fg,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;'); }\n\n// ── STATE ─────────────────────────────────────────────────────────────────\nconst _now = new Date();\n_histPush(getDB()); // seed undo history with current state\nlet S = { view:'dashboard', lid:null, modal:null, sett:false,\n          calY:_now.getFullYear(), calM:_now.getMonth() };\n\n// ── TOAST ─────────────────────────────────────────────────────────────────\nfunction toast(msg){\n  let t=document.getElementById('toast');\n  if(!t){ t=document.createElement('div'); t.id='toast'; t.className='toast'; document.body.appendChild(t); }\n  t.innerHTML=`<span class=\"toast-ico\">${iCheckCircle(18)}<\u002Fspan><span>${msg}<\u002Fspan>`;\n  requestAnimationFrame(()=>t.classList.add('show'));\n  clearTimeout(t._h);\n  t._h=setTimeout(()=>t.classList.remove('show'),3400);\n}\n\n// ── HELPERS ───────────────────────────────────────────────────────────────\nfunction daysUntil(d){\n  if(!d) return null;\n  const t=new Date(); t.setHours(0,0,0,0);\n  return Math.round((new Date(d+'T00:00:00')-t)/86400000);\n}\nfunction fmtDate(d){\n  if(!d) return '—';\n  return new Date(d+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});\n}\nfunction fmtPing(ts){\n  const mins=Math.round((Date.now()-ts)/60000);\n  if(mins<1) return 'just now';\n  if(mins<60) return mins+'m ago';\n  const hrs=Math.round(mins/60);\n  if(hrs<24) return hrs+'h ago';\n  return Math.round(hrs/24)+'d ago';\n}\nfunction warnBadge(d,wd){\n  const n=daysUntil(d);\n  if(n===null) return '';\n  if(n<0) return `<span class=\"badge badge-red\">Overdue<\u002Fspan>`;\n  if(n<=wd) return `<span class=\"badge badge-amber\">Due in ${n}d<\u002Fspan>`;\n  return '';\n}\nfunction stats(l,wd){\n  const t=l.assets.length;\n  const pub=l.assets.filter(a=>a.status==='Published').length;\n  const od=l.assets.filter(a=>{ const n=daysUntil(a.deadline); return n!==null&&n<0&&a.status!=='Published'; }).length;\n  const ds=l.assets.filter(a=>{ const n=daysUntil(a.deadline); return n!==null&&n>=0&&n<=wd&&a.status!=='Published'; }).length;\n  return {t,pub,od,ds};\n}\nfunction initials(name){ return (name||'?').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase(); }\n\n// Risk level: 'overdue' | 'soon' | null. Published assets never at risk.\nfunction riskOf(a,wd){\n  if(a.status==='Published') return null;\n  const n=daysUntil(a.deadline);\n  if(n===null) return null;\n  if(n<0) return 'overdue';\n  if(n<=wd) return 'soon';\n  return null;\n}\n// All at-risk assets across launches, flattened with launch ref.\nfunction atRisk(db){\n  const wd=db.settings.warnDays||3;\n  const out=[];\n  db.launches.forEach(l=>{\n    l.assets.forEach(a=>{\n      const r=riskOf(a,wd);\n      if(r) out.push({launch:l,asset:a,risk:r,days:daysUntil(a.deadline)});\n    });\n  });\n  // overdue first, then soonest deadline\n  out.sort((x,y)=>{\n    if(x.risk!==y.risk) return x.risk==='overdue'?-1:1;\n    return x.days-y.days;\n  });\n  return out;\n}\n\n// ── NAV ───────────────────────────────────────────────────────────────────\nfunction rNav(){\n  return `<nav class=\"nav\">\n    <div class=\"nav-left\">\n      <img src=\"assets/logo-green.png\" class=\"nav-logo\" alt=\".strandberg*\">\n      <div class=\"nav-sep\"><\u002Fdiv>\n      <span class=\"nav-label\">Launch Hub<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:2px\">\n      <button class=\"btn-icon\" data-a=\"undo\" title=\"Undo\" style=\"opacity:${_hidx>0?1:.3};cursor:${_hidx>0?'pointer':'default'}\">${iUndo()}<\u002Fbutton>\n      <button class=\"btn-icon\" data-a=\"redo\" title=\"Redo\" style=\"opacity:${_hidx<_hist.length-1?1:.3};cursor:${_hidx<_hist.length-1?'pointer':'default'}\">${iRedo()}<\u002Fbutton>\n      <div style=\"width:1px;height:16px;background:var(--steel);margin:0 4px\"><\u002Fdiv>\n      <button class=\"btn-icon\" data-a=\"theme\" title=\"Toggle light/dark theme\" id=\"theme-btn\">${document.body.classList.contains('light')?iMoon():iSun()}<\u002Fbutton>\n      <button class=\"btn-icon\" data-a=\"sett\" title=\"Settings\">${iGear()}<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fnav>`;\n}\n\n// ── ATTENTION PANEL ───────────────────────────────────────────────────────\nfunction rAttentionRow(item,db){\n  const {launch:l,asset:a,risk,days}=item;\n  const badge=risk==='overdue'\n    ? `<span class=\"badge badge-red\">Overdue ${Math.abs(days)}d<\u002Fspan>`\n    : `<span class=\"badge badge-amber\">Due in ${days}d<\u002Fspan>`;\n  const owner=a.owner\n    ? `<span class=\"attn-owner\"><span class=\"attn-owner-av\">${initials(a.owner)}<\u002Fspan>${esc(a.owner)}<\u002Fspan>`\n    : `<span class=\"attn-owner attn-owner-none\">Unassigned<\u002Fspan>`;\n  const pinged=a.lastPinged?`<span class=\"pinged-tag\">${fmtPing(a.lastPinged)}<\u002Fspan>`:\"\\'\";\n  const pingBtn=`<label class=\"remind-check${a.lastPinged?' checked':''}\"><input type=\"checkbox\" data-a=\"ping\" data-lid=\"${l.id}\" data-aid=\"${a.id}\"${a.lastPinged?' checked':''}${!a.owner?' disabled':''}> Reminded<\u002Flabel>`;\n  return `<div class=\"attn-row\">\n    <span class=\"attn-launch\" data-a=\"open\" data-id=\"${l.id}\">${esc(l.name)}<\u002Fspan>\n    <span class=\"attn-asset\">${esc(a.label)} ${badge}<\u002Fspan>\n    ${owner}\n    <div class=\"ping-cell\">${pinged}${pingBtn}<\u002Fdiv>\n  <\u002Fdiv>`;\n}\nfunction rAttention(db){\n  const items=atRisk(db);\n  if(items.length===0) return '';\n  const overdue=items.filter(i=>i.risk==='overdue');\n  const soon=items.filter(i=>i.risk==='soon');\n  let html='';\n  if(overdue.length){\n    html+=`<div class=\"attn attn-overdue\">\n      <div class=\"attn-hd\">\n        <span class=\"attn-hd-dot\" style=\"background:var(--red)\"><\u002Fspan>\n        <span class=\"attn-hd-title\" style=\"color:var(--red)\">${iBell(15)} Overdue<\u002Fspan>\n        <span class=\"attn-hd-count\">${overdue.length} asset${overdue.length>1?'s':''} need attention<\u002Fspan>\n      <\u002Fdiv>\n      ${overdue.map(i=>rAttentionRow(i,db)).join('')}\n    <\u002Fdiv>`;\n  }\n  if(soon.length){\n    html+=`<div class=\"attn\">\n      <div class=\"attn-hd\">\n        <span class=\"attn-hd-dot\" style=\"background:var(--orange)\"><\u002Fspan>\n        <span class=\"attn-hd-title\" style=\"color:var(--orange)\">${iBell(15)} Due soon<\u002Fspan>\n        <span class=\"attn-hd-count\">${soon.length} asset${soon.length>1?'s':''} approaching deadline<\u002Fspan>\n      <\u002Fdiv>\n      ${soon.map(i=>rAttentionRow(i,db)).join('')}\n    <\u002Fdiv>`;\n  }\n  return html;\n}\n\n// ── CALENDAR ──────────────────────────────────────────────────────────────\nfunction rCalendar(db){\n  const launches=db.launches.filter(l=>l.launchDate);\n  const y=S.calY, m=S.calM;\n  const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];\n  const DOW=['Mo','Tu','We','Th','Fr','Sa','Su'];\n\n  // Map date → launches\n  const map={};\n  launches.forEach(l=>{ if(!map[l.launchDate]) map[l.launchDate]=[]; map[l.launchDate].push(l); });\n\n  const firstDow=(new Date(y,m,1).getDay()+6)%7;\n  const daysInMonth=new Date(y,m+1,0).getDate();\n  const cells=Math.ceil((firstDow+daysInMonth)/7)*7;\n  const todayStr=new Date().toISOString().slice(0,10);\n\n  let days='';\n  for(let i=0;i<cells;i++){\n    const dn=i-firstDow+1;\n    if(dn<1||dn>daysInMonth){ days+=`<div><\u002Fdiv>`; continue; }\n    const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(dn).padStart(2,'0')}`;\n    const dl=map[ds]||[];\n    const cls=`cal-day${ds===todayStr?' cal-day-today':''}${dl.length?' cal-day-has':''}`;\n    const dots=dl.map(l=>`<div class=\"cal-dot\" data-a=\"open\" data-id=\"${l.id}\" title=\"${esc(l.name)}\"><\u002Fdiv>`).join('');\n    days+=`<div class=\"${cls}\"><span class=\"cal-day-n\">${dn}<\u002Fspan>${dots}<\u002Fdiv>`;\n  }\n\n  const pm=m===0?{y:y-1,m:11}:{y,m:m-1};\n  const nm=m===11?{y:y+1,m:0}:{y,m:m+1};\n\n  // Upcoming: all launches from this month forward\n  const fromStr=`${y}-${String(m+1).padStart(2,'0')}-01`;\n  const upcoming=launches.filter(l=>l.launchDate>=fromStr).sort((a,b)=>a.launchDate.localeCompare(b.launchDate)).slice(0,7);\n  const upHtml=upcoming.length===0\n    ? `<div class=\"cal-up-empty\">No upcoming launches<\u002Fdiv>`\n    : upcoming.map(l=>{\n        const d=daysUntil(l.launchDate);\n        const badge=d===0?`<span class=\"badge badge-green\" style=\"flex-shrink:0\">Today<\u002Fspan>`:d<0?`<span class=\"badge badge-red\" style=\"flex-shrink:0\">${Math.abs(d)}d ago<\u002Fspan>`:d<=14?`<span class=\"badge badge-amber\" style=\"flex-shrink:0\">${d}d<\u002Fspan>`:'';\n        return `<div class=\"cal-up-item\" data-a=\"open\" data-id=\"${l.id}\">\n          <div class=\"cal-up-dot\"><\u002Fdiv>\n          <span class=\"cal-up-date\">${fmtDate(l.launchDate)}<\u002Fspan>\n          <span class=\"cal-up-name\">${esc(l.name)}<\u002Fspan>\n          ${badge}\n        <\u002Fdiv>`;\n      }).join('');\n\n  return `<div class=\"cal-wrap\">\n    <span class=\"eyebrow\">Launch calendar<\u002Fspan>\n    <div class=\"cal-section\">\n      <div class=\"cal-left\">\n        <div class=\"cal-hd\">\n          <button class=\"btn-icon\" data-a=\"cal-nav\" data-y=\"${pm.y}\" data-m=\"${pm.m}\" title=\"Previous month\">${iArrow()}<\u002Fbutton>\n          <span class=\"cal-month-name\">${MONTHS[m]} ${y}<\u002Fspan>\n          <button class=\"btn-icon\" data-a=\"cal-nav\" data-y=\"${nm.y}\" data-m=\"${nm.m}\" title=\"Next month\">${iChevR()}<\u002Fbutton>\n        <\u002Fdiv>\n        <div class=\"cal-grid\">\n          ${DOW.map(d=>`<div class=\"cal-dow\">${d}<\u002Fdiv>`).join('')}\n          ${days}\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"cal-right\">\n        <div class=\"cal-up-hd\">Upcoming<\u002Fdiv>\n        ${upHtml}\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>`;\n}\n\n// ── DASHBOARD ─────────────────────────────────────────────────────────────\nfunction rDash(db){\n  const {launches,settings:{warnDays:wd}}=db;\n  const grid=launches.length===0\n    ? `<div class=\"empty\">\n        <div class=\"empty-icon\">${iRocket()}<\u002Fdiv>\n        <h3>No launches yet<\u002Fh3>\n        <p>Create your first launch to start tracking assets.<\u002Fp>\n        <button class=\"btn btn-primary\" data-a=\"new-launch\">${iPlus(13)} New launch<\u002Fbutton>\n      <\u002Fdiv>`\n    : `<div class=\"launches-grid\">${launches.map(l=>rCard(l,wd)).join('')}<\u002Fdiv>`;\n  return `<div class=\"page\">\n    <div class=\"page-header\">\n      <div>\n        <h1 class=\"page-title\">Launches<\u002Fh1>\n      <\u002Fdiv>\n      ${launches.length>0?`<button class=\"btn btn-primary\" data-a=\"new-launch\">${iPlus(13)} New launch<\u002Fbutton>`:''}\n    <\u002Fdiv>\n    ${rAttention(db)}\n    ${rCalendar(db)}\n    ${grid}\n  <\u002Fdiv>`;\n}\n\nfunction rCard(l,wd){\n  const s=stats(l,wd);\n  const pct=s.t>0?Math.round(s.pub/s.t*100):0;\n  let badges='';\n  if(s.od>0) badges+=`<span class=\"badge badge-red\">${s.od} overdue<\u002Fspan>`;\n  if(s.ds>0) badges+=`<span class=\"badge badge-amber\">${s.ds} due soon<\u002Fspan>`;\n  if(s.t>0&&s.pub===s.t) badges+=`<span class=\"badge badge-green\">All delivered<\u002Fspan>`;\n  return `<div class=\"launch-card\" data-a=\"open\" data-id=\"${l.id}\" style=\"position:relative\">\n    <button class=\"btn-icon lc-del\" data-a=\"del-card\" data-id=\"${l.id}\" title=\"Delete launch\">${iTrash(14)}<\u002Fbutton>\n    <div class=\"lc-name\">${esc(l.name)}<\u002Fdiv>\n    <div class=\"lc-date\">${l.launchDate?fmtDate(l.launchDate):'No date set'}<\u002Fdiv>\n    <div class=\"pbar-track\"><div class=\"pbar-fill\" style=\"width:${pct}%\"><\u002Fdiv><\u002Fdiv>\n    <div class=\"pbar-label\"><span><b>${s.pub}<\u002Fb> / ${s.t} assets delivered<\u002Fspan><span>${pct}%<\u002Fspan><\u002Fdiv>\n    ${badges?`<div class=\"lc-badges\">${badges}<\u002Fdiv>`:''}\n  <\u002Fdiv>`;\n}\n\n// ── EXPORT BRIEF ─────────────────────────────────────────────────────────\nfunction generateBrief(l){\n  const line = '─'.repeat(52);\n  const today = new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});\n  let t = '';\n  t += `LAUNCH BRIEF\\n`;\n  t += `${l.name.toUpperCase()}\\n`;\n  t += `Launch date: ${l.launchDate?fmtDate(l.launchDate):'TBD'}\\n`;\n  t += `Generated: ${today}\\n\\n`;\n  t += `${line}\\n\\n`;\n  if(l.brief && l.brief.trim()){\n    t += `PROJECT BRIEF\\n\\n`;\n    t += l.brief.trim() + '\\n\\n';\n    t += `${line}\\n\\n`;\n  }\n  t += `ASSETS & ASSIGNMENTS\\n\\n`;\n  l.assets.forEach(a=>{\n    t += `${a.label.toUpperCase()}\\n`;\n    t += `Owner:    ${a.owner||'Unassigned'}\\n`;\n    t += `Deadline: ${a.deadline?fmtDate(a.deadline):'TBD'}\\n`;\n    if(a.status&&a.status!=='Not started') t += `Status:   ${a.status}\\n`;\n    if(a.notes&&a.notes.trim()) t += `Notes:    ${a.notes.trim()}\\n`;\n    t += `\\n`;\n  });\n  t += `${line}\\n`;\n  const pub=l.assets.filter(a=>a.status==='Published').length;\n  t += `${l.assets.length} assets total · ${pub} delivered · ${l.assets.length-pub} remaining\\n\\n`;\n  t += `Please confirm receipt and flag any questions or deadline conflicts.\\n`;\n  return t;\n}\nfunction rExportModal(l){\n  const brief=generateBrief(l);\n  return `<div class=\"overlay\" id=\"ov\">\n    <div class=\"modal export-modal\">\n      <h3 style=\"margin-bottom:6px\">Export brief<\u002Fh3>\n      <p style=\"font-size:13px;color:var(--ash);margin-bottom:20px\">Copy and paste into an email or message.<\u002Fp>\n      <textarea class=\"export-ta\" id=\"brief-ta\" readonly>${esc(brief)}<\u002Ftextarea>\n      <div class=\"modal-ft\" style=\"margin-top:16px\">\n        <span class=\"export-copied\" id=\"copy-ok\">Copied!<\u002Fspan>\n        <button class=\"btn btn-ghost\" data-a=\"close-modal\">Close<\u002Fbutton>\n        <button class=\"btn btn-primary\" data-a=\"copy-brief\">${iClipboard(13)} Copy brief<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>`;\n}\n\n// ── BRIEF DROPDOWN ───────────────────────────────────────────────────────\nfunction rBriefDrop(l){\n  const hasBrief = l.brief && l.brief.trim();\n  const bodyContent = hasBrief\n    ? `<p class=\"brief-text\">${esc(l.brief.trim())}<\u002Fp>`\n    : `<p class=\"brief-text-empty\">Click \"Upload file\" to add a .txt or .md brief.<\u002Fp>`;\n  return `<details class=\"coll-section\" open>\n    <summary class=\"coll-sum\">\n      <span class=\"coll-eyebrow\">Launch Brief<\u002Fspan>\n      <span class=\"coll-title\">${hasBrief?'Core message, USPs, copy':'No brief added yet'}<\u002Fspan>\n      <span class=\"coll-arrow\"><\u002Fspan>\n    <\u002Fsummary>\n    <div class=\"coll-body\">\n      ${bodyContent}\n      <div style=\"margin-top:14px;display:flex;align-items:center;gap:10px\">\n        <input type=\"file\" id=\"brief-file-inp\" accept=\".txt,.md,.markdown\" style=\"display:none\">\n        <button class=\"btn btn-ghost\" style=\"font-size:11px;padding:5px 12px\" id=\"brief-file-btn\">Upload .txt / .md<\u002Fbutton>\n        ${hasBrief?'<button class=\"btn btn-ghost\" style=\"font-size:11px;padding:5px 12px;color:var(--ash)\" data-a=\"edit\">Edit brief<\u002Fbutton>':'<button class=\"btn btn-ghost\" style=\"font-size:11px;padding:5px 12px;color:var(--ash)\" data-a=\"edit\">Type brief<\u002Fbutton>'}\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdetails>`;\n}\n\n// ── LAUNCH DETAIL ─────────────────────────────────────────────────────────\nfunction rDetail(db){\n  const l=db.launches.find(l=>l.id===S.lid);\n  if(!l){ S.view='dashboard'; return rDash(db); }\n  const wd=db.settings.warnDays||3;\n  const selIds=l.assets.map(a=>a.typeId);\n\n  const tiles=TYPES.map(t=>{\n    const sel=selIds.includes(t.id);\n    return `<div class=\"tile${sel?' sel':''}\" data-a=\"toggle\" data-tid=\"${t.id}\">\n      <div class=\"tile-chk\">${iCheck()}<\u002Fdiv>\n      <div class=\"tile-icon\">${t.ico()}<\u002Fdiv>\n      <div class=\"tile-label\">${t.label}<\u002Fdiv>\n      ${t.auto?`<div class=\"tile-dflt\">Default<\u002Fdiv>`:''}\n    <\u002Fdiv>`;\n  }).join('')+`<div class=\"tile tile-custom\" data-a=\"add-custom\">\n    <div class=\"tile-icon\">${iPlus(26)}<\u002Fdiv>\n    <div class=\"tile-label\">Custom asset<\u002Fdiv>\n  <\u002Fdiv>`;\n\n  return `<div class=\"page\">\n    <button class=\"back\" data-a=\"back\">${iArrow()} All launches<\u002Fbutton>\n    <div class=\"ld-header\">\n      <div style=\"display:flex;align-items:flex-start;gap:24px;flex:1\">\n        ${l.img\n          ? `<div class=\"ld-img-wrap\"><img class=\"ld-img\" src=\"${l.img}\" alt=\"\"><div class=\"ld-img-upload-btn\" style=\"display:flex;gap:4px\"><button class=\"btn-icon\" data-a=\"img-upload-det\" title=\"Change image\">${iCamera(13)}<\u002Fbutton><button class=\"btn-icon\" data-a=\"img-clear\" title=\"Remove image\" style=\"color:var(--ash)\">${iX(13)}<\u002Fbutton><\u002Fdiv><\u002Fdiv>`\n          : `<div class=\"ld-img-placeholder\" data-a=\"img-upload-det\" title=\"Add product image\">${iCamera(22)}<span>Add image<\u002Fspan><\u002Fdiv>`\n        }\n        <div>\n          <span class=\"eyebrow\">Launch<\u002Fspan>\n          <h1 class=\"ld-name\">${esc(l.name)}<\u002Fh1>\n          <div class=\"ld-date\">${l.launchDate?fmtDate(l.launchDate):'No launch date set'}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"ld-actions\">\n        <button class=\"btn btn-ghost\" data-a=\"export\">${iClipboard(14)} Export Content Brief<\u002Fbutton>\n        <div style=\"width:1px;height:20px;background:var(--steel);margin:0 2px\"><\u002Fdiv>\n        <button class=\"btn-icon\" data-a=\"edit\" title=\"Edit launch\">${iEdit(16)}<\u002Fbutton>\n        <button class=\"btn-icon\" data-a=\"reset-launch\" title=\"Reset assets to defaults\" style=\"color:var(--ash)\">${iRefresh(16)}<\u002Fbutton>\n        <button class=\"btn-icon\" data-a=\"del-launch\" title=\"Delete launch\" style=\"color:var(--red)\">${iTrash(16)}<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    ${rBriefDrop(l)}\n    <details class=\"coll-section\" open>\n      <summary class=\"coll-sum\">\n        <span class=\"coll-eyebrow\">Choose Launch Assets<\u002Fspan>\n        <span class=\"coll-meta\">${l.assets.length>0?l.assets.length+' selected':''}<\u002Fspan>\n        <span class=\"coll-arrow\"><\u002Fspan>\n      <\u002Fsummary>\n      <div class=\"coll-body\"><div class=\"asset-tiles\" style=\"padding:0\">${tiles}<\u002Fdiv><\u002Fdiv>\n    <\u002Fdetails>\n    ${l.assets.length>0?`<details class=\"coll-section\" open>\n      <summary class=\"coll-sum\">\n        <span class=\"coll-eyebrow\">Production Plan<\u002Fspan>\n        <span class=\"coll-meta\">${stats(l,wd).pub}/${l.assets.length} delivered<\u002Fspan>\n        <span class=\"coll-arrow\"><\u002Fspan>\n      <\u002Fsummary>\n      <div class=\"coll-body-tight\">${rTable(l,wd,db)}<\u002Fdiv>\n    <\u002Fdetails>`:''}\n  <\u002Fdiv>`;\n}\n\nfunction rTable(l,wd,db){\n  const s=stats(l,wd);\n  const rows=l.assets.map(a=>{\n    const ownerOpts=['',...getOwners(db)].map(o=>`<option value=\"${esc(o)}\" ${a.owner===o?'selected':''}>${o||'Unassigned'}<\u002Foption>`).join('');\n    const steps=STATUSES.map(st=>{\n      const act=a.status===st.label;\n      return `<button class=\"s-btn${act?' '+st.cls:''}\" data-a=\"status\" data-aid=\"${a.id}\" data-status=\"${st.label}\">${st.label}<\u002Fbutton>`;\n    }).join('');\n    const badge=warnBadge(a.deadline,wd);\n    const risk=riskOf(a,wd);\n    const pingBtn=risk&&a.owner\n      ? `<label class=\"remind-check remind-check-sm${a.lastPinged?' checked':''}\" title=\"Mark as reminded\"><input type=\"checkbox\" data-a=\"ping\" data-lid=\"${l.id}\" data-aid=\"${a.id}\"${a.lastPinged?' checked':''}> Reminded<\u002Flabel>`\n      : '';\n    return `<tr class=\"arow\">\n      <td class=\"col-n\"><span class=\"row-name\">${esc(a.label)}<\u002Fspan><\u002Ftd>\n      <td class=\"col-o\"><select data-a=\"owner\" data-aid=\"${a.id}\">${ownerOpts}<\u002Fselect><\u002Ftd>\n      <td class=\"col-d\"><div class=\"date-cell\"><input type=\"date\" value=\"${a.deadline||''}\" data-a=\"deadline\" data-aid=\"${a.id}\">${badge}<\u002Fdiv><\u002Ftd>\n      <td class=\"col-s\"><div class=\"stepper\">${steps}<\u002Fdiv><\u002Ftd>\n      <td class=\"col-x\"><div class=\"ping-cell\">${pingBtn}<button class=\"btn-icon\" data-a=\"remove\" data-aid=\"${a.id}\" title=\"Remove\">${iTrash()}<\u002Fbutton><\u002Fdiv><\u002Ftd>\n    <\u002Ftr><tr class=\"nrow\">\n      <td colspan=\"5\"><textarea class=\"notes-ta\" data-a=\"notes\" data-aid=\"${a.id}\" placeholder=\"Add notes…\">${esc(a.notes||'')}<\u002Ftextarea><\u002Ftd>\n    <\u002Ftr>`;\n  }).join('');\n  return `<table>\n    <thead><tr>\n      <th class=\"col-n\">Asset<\u002Fth>\n      <th class=\"col-o\">Owner<\u002Fth>\n      <th class=\"col-d\">Internal deadline<\u002Fth>\n      <th class=\"col-s\">Status<\u002Fth>\n      <th class=\"col-x\"><\u002Fth>\n    <\u002Ftr><\u002Fthead>\n    <tbody>${rows}<\u002Ftbody>\n  <\u002Ftable>`;\n}\n\n// ── MODALS ────────────────────────────────────────────────────────────────\nfunction rNewModal(){\n  return `<div class=\"overlay\" id=\"ov\">\n    <div class=\"modal\">\n      <h3>New launch<\u002Fh3>\n      <div class=\"fgroup\"><label class=\"flabel\" for=\"nl-n\">Launch name<\u002Flabel>\n        <input class=\"finput\" type=\"text\" id=\"nl-n\" placeholder=\"e.g. Boden NX7 Drop\" autocomplete=\"off\"><\u002Fdiv>\n      <div class=\"fgroup\"><label class=\"flabel\" for=\"nl-d\">Launch date<\u002Flabel>\n        <input class=\"finput\" type=\"date\" id=\"nl-d\"><\u002Fdiv>\n      <p style=\"font-size:12px;color:var(--ash);margin-top:-8px\">Product photos and On-Location Material will be added automatically.<\u002Fp>\n      <div class=\"fgroup\"><label class=\"flabel\" for=\"nl-b\">Project brief <span style=\"font-weight:400;color:var(--ash);font-size:11px\">(optional)<\u002Fspan><\u002Flabel>\n        <textarea class=\"finput\" id=\"nl-b\" rows=\"4\" placeholder=\"Core message, USPs, copy direction…\" style=\"resize:vertical;min-height:80px;line-height:1.6\"><\u002Ftextarea><\u002Fdiv>\n      <div class=\"modal-ft\">\n        <button class=\"btn btn-ghost\" data-a=\"close-modal\">Cancel<\u002Fbutton>\n        <button class=\"btn btn-primary\" data-a=\"do-create\">${iPlus(13)} Create launch<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>`;\n}\nfunction rEditModal(l){\n  return `<div class=\"overlay\" id=\"ov\">\n    <div class=\"modal\">\n      <h3>Edit launch<\u002Fh3>\n      <div class=\"fgroup\"><label class=\"flabel\" for=\"el-n\">Launch name<\u002Flabel>\n        <input class=\"finput\" type=\"text\" id=\"el-n\" value=\"${esc(l.name)}\" autocomplete=\"off\"><\u002Fdiv>\n      <div class=\"fgroup\"><label class=\"flabel\" for=\"el-d\">Launch date<\u002Flabel>\n        <input class=\"finput\" type=\"date\" id=\"el-d\" value=\"${l.launchDate||''}\"><\u002Fdiv>\n      <div class=\"fgroup\"><label class=\"flabel\" for=\"el-b\">Project brief<\u002Flabel>\n        <textarea class=\"finput\" id=\"el-b\" rows=\"5\" style=\"resize:vertical;min-height:100px;line-height:1.6\">${esc(l.brief||'')}<\u002Ftextarea><\u002Fdiv>\n      <div class=\"modal-ft\">\n        <button class=\"btn btn-ghost\" data-a=\"close-modal\">Cancel<\u002Fbutton>\n        <button class=\"btn btn-primary\" data-a=\"do-edit\">Save<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>`;\n}\nfunction rCustomModal(){\n  return `<div class=\"overlay\" id=\"ov\">\n    <div class=\"modal\">\n      <h3>Custom asset<\u002Fh3>\n      <div class=\"fgroup\"><label class=\"flabel\" for=\"ca-n\">Asset name<\u002Flabel>\n        <input class=\"finput\" type=\"text\" id=\"ca-n\" placeholder=\"e.g. Behind-the-scenes reel\" autocomplete=\"off\"><\u002Fdiv>\n      <div class=\"modal-ft\">\n        <button class=\"btn btn-ghost\" data-a=\"close-modal\">Cancel<\u002Fbutton>\n        <button class=\"btn btn-primary\" data-a=\"do-custom\">${iPlus(13)} Add asset<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>`;\n}\nfunction rDelModal(l){\n  return `<div class=\"overlay\" id=\"ov\">\n    <div class=\"modal\">\n      <h3 style=\"color:var(--red)\">Delete launch?<\u002Fh3>\n      <p style=\"color:var(--fog);font-size:15px;line-height:1.6;margin-bottom:8px\">\n        This will permanently delete <strong style=\"color:var(--white)\">${esc(l.name)}<\u002Fstrong> and all its assets.<\u002Fp>\n      <p style=\"font-size:13px;color:var(--ash)\">There is no undo.<\u002Fp>\n      <div class=\"modal-ft\">\n        <button class=\"btn btn-ghost\" data-a=\"close-modal\">Cancel<\u002Fbutton>\n        <button class=\"btn btn-danger-fill\" data-a=\"do-del\">Delete<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>`;\n}\nfunction rSett(db){\n  const wd=db.settings.warnDays||3;\n  return `<div class=\"sett-wrap\">\n    <div class=\"sett-bd\" data-a=\"close-sett\"><\u002Fdiv>\n    <div class=\"sett-panel\">\n      <div class=\"sett-head\">\n        <h3>Settings<\u002Fh3>\n        <button class=\"btn-icon\" data-a=\"close-sett\">${iX()}<\u002Fbutton>\n      <\u002Fdiv>\n      <div class=\"sg\">\n        <div class=\"sg-label\">Deadline warnings<\u002Fdiv>\n        <div class=\"sg-row\">\n          <span class=\"sg-row-lbl\">Warn days before deadline<\u002Fspan>\n          <input type=\"number\" id=\"wd-in\" value=\"${wd}\" min=\"1\" max=\"30\" style=\"width:68px;padding:7px 12px;text-align:center\">\n        <\u002Fdiv>\n        <p class=\"sg-hint\">Assets due within <strong style=\"color:var(--orange)\" id=\"wd-prev\">${wd}<\u002Fstrong> days show a yellow warning. Overdue assets always show red.<\u002Fp>\n        <button class=\"btn btn-ghost\" data-a=\"save-sett\">Save settings<\u002Fbutton>\n      <\u002Fdiv>\n      <div class=\"sg\">\n        <div class=\"sg-label\">People<\u002Fdiv>\n        <p class=\"sg-hint\">Owners available when assigning assets.<\u002Fp>\n        <div class=\"people-list\">\n          ${getOwners(db).map(o=>`<div class=\"people-row\">\n            <span class=\"people-av\">${initials(o)}<\u002Fspan>\n            <span class=\"people-name\">${esc(o)}<\u002Fspan>\n            <button class=\"btn-icon\" data-a=\"remove-person\" data-name=\"${esc(o)}\" title=\"Remove\">${iX(14)}<\u002Fbutton>\n          <\u002Fdiv>`).join('')}\n        <\u002Fdiv>\n        <div class=\"people-add\">\n          <input type=\"text\" id=\"new-person-inp\" placeholder=\"Add a person…\" maxlength=\"30\">\n          <button class=\"btn btn-ghost\" data-a=\"add-person\">Add<\u002Fbutton>\n        <\u002Fdiv>\n      <div class=\"dz\">\n        <div class=\"sg-label\">Danger zone<\u002Fdiv>\n        <p class=\"sg-hint\">This will delete all launches and assets. There is no undo.<\u002Fp>\n        <button class=\"btn btn-danger\" data-a=\"clear\">Clear all data<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>`;\n}\n\n// ── IMAGE UPLOAD ─────────────────────────────────────────────────────────\nlet _imgInput = null;\nfunction compressImg(dataUrl, fileType, cb){\n  const img = new Image();\n  img.onload = ()=>{\n    const MAX = 700;\n    const scale = Math.min(1, MAX / Math.max(img.width, img.height));\n    const w = Math.round(img.width * scale);\n    const h = Math.round(img.height * scale);\n    const c = document.createElement('canvas');\n    c.width = w; c.height = h;\n    const ctx = c.getContext('2d');\n    const isPng = fileType === 'image/png';\n    if(!isPng){ ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, w, h); }\n    ctx.drawImage(img, 0, 0, w, h);\n    cb(isPng ? c.toDataURL('image/png') : c.toDataURL('image/jpeg', 0.80));\n  };\n  img.src = dataUrl;\n}\nfunction triggerImgUpload(lid){\n  if(!_imgInput){ _imgInput=document.createElement('input'); _imgInput.type='file'; _imgInput.accept='image/*'; document.body.appendChild(_imgInput); }\n  _imgInput.onchange=()=>{\n    const f=_imgInput.files[0]; if(!f) return;\n    const reader=new FileReader();\n    reader.onload=ev=>{\n      compressImg(ev.target.result, f.type, compressed=>{\n        try{\n          const db=getDB();\n          const l=db.launches.find(l=>l.id===lid);\n          if(l){ l.img=compressed; saveDB(db); render(); toast('Image updated'); }\n        } catch(e){\n          toast('Image too large — try a smaller file');\n        }\n      });\n    };\n    reader.readAsDataURL(f);\n    _imgInput.value='';\n  };\n  _imgInput.click();\n}\n\n// ── RENDER ────────────────────────────────────────────────────────────────\nfunction render(){\n  const db=getDB();\n  let html=rNav();\n  if(S.view==='launch') html+=rDetail(db);\n  else html+=rDash(db);\n  if(S.modal==='new') html+=rNewModal();\n  else if(S.modal==='edit'){ const l=db.launches.find(l=>l.id===S.lid); if(l) html+=rEditModal(l); }\n  else if(S.modal==='custom') html+=rCustomModal();\n  else if(S.modal==='del'){ const l=db.launches.find(l=>l.id===S.lid); if(l) html+=rDelModal(l); }\n  else if(S.modal==='export'){ const l=db.launches.find(l=>l.id===S.lid); if(l) html+=rExportModal(l); }\n  if(S.sett) html+=rSett(db);\n  document.getElementById('app').innerHTML=html;\n  const wi=document.getElementById('wd-in'),wp=document.getElementById('wd-prev');\n  if(wi&&wp){\n    wi.addEventListener('input',()=>{ wp.textContent=wi.value||3; });\n    wi.addEventListener('keydown',e=>{ if(e.key==='Enter') document.querySelector('[data-a=\"save-sett\"]').click(); });\n  }\n  const fi=document.querySelector('.modal .finput');\n  if(fi) setTimeout(()=>fi.focus(),30);\n  const pi=document.getElementById('new-person-inp');\n  if(pi) pi.addEventListener('keydown',e=>{ if(e.key==='Enter') document.querySelector('[data-a=\"add-person\"]').click(); });\n  // Image upload — detail\n  const imgDetEl=document.querySelector('[data-a=\"img-upload-det\"]');\n  if(imgDetEl) imgDetEl.addEventListener('click', e=>{ e.stopPropagation(); triggerImgUpload(S.lid); });\n\n  const fb=document.getElementById('brief-file-btn');\n  const fi2=document.getElementById('brief-file-inp');\n  if(fb&&fi2){\n    fb.addEventListener('click',()=>fi2.click());\n    fi2.addEventListener('change',()=>{\n      const f=fi2.files[0]; if(!f) return;\n      const reader=new FileReader();\n      reader.onload=ev=>{\n        const db=getDB();\n        const l=db.launches.find(l=>l.id===S.lid);\n        if(l){ l.brief=ev.target.result||''; saveDB(db); render(); toast('Brief loaded from '+f.name); }\n      };\n      reader.readAsText(f);\n    });\n  }\n}\n\n// ── EVENTS ────────────────────────────────────────────────────────────────\ndocument.addEventListener('click', e=>{\n  if(e.target.id==='ov'){ S.modal=null; render(); return; }\n  const el=e.target.closest('[data-a]');\n  if(!el) return;\n  const a=el.dataset.a;\n  const db=getDB();\n\n  if(a==='undo'){ undoDB(); return; }\n  if(a==='redo'){ redoDB(); return; }\n  if(a==='del-card'){\n    e.stopPropagation();\n    const db=getDB();\n    const l=db.launches.find(l=>l.id===el.dataset.id);\n    if(!l) return;\n    if(!confirm('Delete \"'+l.name+'\"?')) return;\n    db.launches=db.launches.filter(l=>l.id!==el.dataset.id);\n    saveDB(db); render(); return;\n  }\n  if(a==='theme'){ toggleTheme(); return; }\n  if(a==='sett'){ S.sett=!S.sett; render(); return; }\n  if(a==='close-sett'){ S.sett=false; render(); return; }\n  if(a==='close-modal'){ S.modal=null; render(); return; }\n  if(a==='new-launch'){ S.modal='new'; render(); return; }\n  if(a==='back'){ S.view='dashboard'; S.lid=null; render(); return; }\n  if(a==='edit'){ S.modal='edit'; render(); return; }\n  if(a==='add-custom'){ S.modal='custom'; render(); return; }\n  if(a==='img-clear'){\n    const db=getDB(); const l=db.launches.find(l=>l.id===S.lid);\n    if(l){ delete l.img; saveDB(db); render(); } return;\n  }\n  if(a==='export'){ S.modal='export'; render(); return; }\n\n  if(a==='copy-brief'){\n    const ta=document.getElementById('brief-ta');\n    if(ta){ navigator.clipboard.writeText(ta.value).then(()=>{\n      const ok=document.getElementById('copy-ok');\n      if(ok){ ok.classList.add('show'); setTimeout(()=>ok.classList.remove('show'),2000); }\n    }); }\n    return;\n  }\n\n  if(a==='reset-launch'){\n    if(!confirm('Reset all assets to defaults? Custom assets and notes will be lost.')) return;\n    const db=getDB(); const l=db.launches.find(l=>l.id===S.lid);\n    if(l){ l.assets=TYPES.filter(t=>t.auto).map(t=>mkAsset(t,l.launchDate)); saveDB(db); render(); toast('Reset to defaults'); }\n    return;\n  }\n  if(a==='del-launch'){ S.modal='del'; render(); return; }\n\n  if(a==='cal-nav'){\n    S.calY=parseInt(el.dataset.y); S.calM=parseInt(el.dataset.m); render(); return;\n  }\n\n  if(a==='add-person'){\n    const inp=document.getElementById('new-person-inp');\n    const name=(inp&&inp.value.trim())||'';\n    if(!name) return;\n    const owners=getOwners(db);\n    if(!owners.includes(name)){ db.settings.owners=[...owners,name]; saveDB(db); render(); inp.value=''; toast(name+' added'); }\n    return;\n  }\n\n  if(a==='remove-person'){\n    const name=el.dataset.name;\n    db.settings.owners=getOwners(db).filter(o=>o!==name);\n    saveDB(db); render(); return;\n  }\n\n  if(a==='open'){\n    S.lid=el.dataset.id; S.view='launch'; render(); return;\n  }\n\n  if(a==='do-create'){\n    const name=document.getElementById('nl-n').value.trim();\n    const date=document.getElementById('nl-d').value;\n    if(!name){ document.getElementById('nl-n').focus(); return; }\n    const autoAssets=TYPES.filter(t=>t.auto).map(t=>mkAsset(t,date));\n    const brief=(document.getElementById('nl-b')?.value||'').trim();\n    const l={id:uid(),name,launchDate:date,assets:autoAssets,brief};\n    db.launches.unshift(l); saveDB(db);\n    S.modal=null; S.lid=l.id; S.view='launch'; render(); return;\n  }\n\n  if(a==='do-edit'){\n    const name=document.getElementById('el-n').value.trim();\n    const date=document.getElementById('el-d').value;\n    if(!name){ document.getElementById('el-n').focus(); return; }\n    const l=db.launches.find(l=>l.id===S.lid);\n    const brief=(document.getElementById('el-b')?.value||'').trim();\n    if(l){ l.name=name; l.launchDate=date; l.brief=brief; saveDB(db); }\n    S.modal=null; render(); return;\n  }\n\n  if(a==='do-del'){\n    db.launches=db.launches.filter(l=>l.id!==S.lid); saveDB(db);\n    S.modal=null; S.view='dashboard'; S.lid=null; render(); return;\n  }\n\n  if(a==='do-custom'){\n    const label=document.getElementById('ca-n').value.trim();\n    if(!label){ document.getElementById('ca-n').focus(); return; }\n    const l=db.launches.find(l=>l.id===S.lid);\n    if(l){ l.assets.push({id:uid(),typeId:'custom-'+uid(),label,owner:'',deadline:'',status:'Not started',notes:''}); saveDB(db); }\n    S.modal=null; render(); return;\n  }\n\n  if(a==='toggle'){\n    const tid=el.dataset.tid;\n    const l=db.launches.find(l=>l.id===S.lid);\n    if(!l) return;\n    const idx=l.assets.findIndex(x=>x.typeId===tid);\n    if(idx>=0){ l.assets.splice(idx,1); }\n    else{ const t=TYPES.find(t=>t.id===tid); if(t) l.assets.push(mkAsset(t,l.launchDate)); }\n    saveDB(db); render(); return;\n  }\n\n  if(a==='remove'){\n    const l=db.launches.find(l=>l.id===S.lid);\n    if(l){ l.assets=l.assets.filter(x=>x.id!==el.dataset.aid); saveDB(db); render(); } return;\n  }\n\n  if(a==='status'){\n    const l=db.launches.find(l=>l.id===S.lid);\n    if(l){ const x=l.assets.find(x=>x.id===el.dataset.aid); if(x){ x.status=el.dataset.status; saveDB(db); render(); } } return;\n  }\n\n  if(a==='save-sett'){\n    const val=parseInt(document.getElementById('wd-in').value)||3;\n    db.settings.warnDays=Math.max(1,Math.min(30,val)); saveDB(db);\n    S.sett=false; render(); return;\n  }\n\n  if(a==='clear'){\n    if(!confirm('Delete ALL data? This cannot be undone.')) return;\n    localStorage.removeItem(DB_KEY);\n    S={view:'dashboard',lid:null,modal:null,sett:false,calY:new Date().getFullYear(),calM:new Date().getMonth()}; render(); return;\n  }\n});\n\ndocument.addEventListener('change', e=>{\n  const el=e.target, a=el.dataset.a;\n  if(!a) return;\n  const db=getDB();\n  if(a==='ping'){\n    const l=db.launches.find(l=>l.id===el.dataset.lid);\n    if(!l) return;\n    const x=l.assets.find(x=>x.id===el.dataset.aid);\n    if(!x) return;\n    x.lastPinged=el.checked?Date.now():null;\n    saveDB(db); render();\n    if(el.checked) toast('Marked as reminded');\n    return;\n  }\n  const l=db.launches.find(l=>l.id===S.lid);\n  if(!l) return;\n  const x=l.assets.find(x=>x.id===el.dataset.aid);\n  if(!x) return;\n  if(a==='owner'){ x.owner=el.value; saveDB(db); }\n  if(a==='deadline'){ x.deadline=el.value; saveDB(db); render(); }\n});\n\n// Notes: save on blur without re-rendering\ndocument.addEventListener('blur', e=>{\n  if(e.target.dataset.a==='notes'){\n    const db=getDB();\n    const l=db.launches.find(l=>l.id===S.lid);\n    if(l){ const x=l.assets.find(x=>x.id===e.target.dataset.aid); if(x){ x.notes=e.target.value; saveDB(db); } }\n  }\n}, true);\n\ndocument.addEventListener('keydown', e=>{\n  if(e.key==='Escape'){\n    if(S.modal){ S.modal=null; render(); }\n    else if(S.sett){ S.sett=false; render(); }\n  }\n  if(e.key==='Enter'&&S.modal){\n    const btn=document.querySelector('.modal-ft .btn-primary');\n    if(btn&&document.activeElement&&document.activeElement.tagName==='INPUT') btn.click();\n  }\n});\n\nrender();\n<\u002Fscript>\n\n\n<\u002Frect><\u002Frect><\u002Frect><\u002Frect><\u002Frect><\u002Frect><\u002Frect><\u002Frect><\u002Frect><\u002Frect><\u002Frect><\u002Fbody><\u002Fhtml>"
